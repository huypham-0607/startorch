# Startorch configuration. startorch.utils.paths reads this file and turns a profile
# name into every artifact path; nothing else builds data paths by hand.

[paths]
upstream = "data/parquet"                          # OpenAlex snapshot prefix on S3
data-root = "/data/scholar_rank/data"              # holds tmp/, full_corpus/, works_subset/
index-root = "/data/scholar_rank/posting"          # one index folder per profile, unless the profile sets index-root
benchmark-root = "/data/scholar_rank/benchmark"    # benchmark results: <benchmark-root>/<profile>/query_result
query-root = "/data/scholar_rank/benchmark/data"   # query sets: <query-root>/<profile>
spill = "/data/scholar_rank/data/spill"            # DuckDB spill directory

[folders]
tmp-corpus = "tmp"
full-corpus = "full_corpus"
works-subset = "works_subset"
lookup = "lookup"
token-stream = "token_stream"
posting = "posting"
partial = "posting/partial"
query-result = "query_result"

[files]
lookup = "doc_id_lookup.bin"

# One table per profile.
#   kind         "openalex" (a filter over the Works corpus) or "msmarco".
#   filter       OpenAlex only: the DuckDB condition selecting the profile's works.
#   materialize  OpenAlex only: copy matching works into works_subset/<profile>
#                (small dev subsets), or read the corpus through the filter
#                (large profiles, where a copy saves little: see docs/refractor.md).
#   k1, b, block-size, split-size, mem-limit
#                Index build parameters. Any left out take BuildParams' defaults
#                (cpp/include/startorch/lexical/build_params.h).

[profiles.math-en]
kind = "openalex"
filter = "topics[1].field_display_name = 'Mathematics' AND language = 'en'"
materialize = true

[profiles.engr-en]
kind = "openalex"
filter = "topics[1].field_display_name = 'Engineering' AND language = 'en'"
materialize = true

[profiles.vet-en]
kind = "openalex"
filter = "topics[1].field_display_name = 'Veterinary' AND language = 'en'"
materialize = true

[profiles.cs-en]
kind = "openalex"
filter = "topics[1].field_display_name = 'Computer Science' AND language = 'en'"
materialize = true

[profiles.full-en]
kind = "openalex"
filter = "language = 'en'"
materialize = false

[profiles.msmarco]
kind = "msmarco"
collection = "/data/scholar_rank/benchmark/data/msmarco/collection.tsv"
index-root = "/data/scholar_rank/benchmark/msmarco"   # where the MS MARCO index already lives
k1 = 0.82                                             # Anserini's MS MARCO passage setting
b = 0.68
