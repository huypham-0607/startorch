[project]
name = "startorch"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "huypham-0607", email = "minhhuypham0607@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.46",
    "duckdb>=1.5.4",
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "tabulate>=0.10.0",
]

[project.scripts]
startorch = "startorch.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

# For Pylance to work properly
[tool.pyright]
extraPaths = ["python/src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "index: needs the built msmarco index under /data (read-only); skipped when it is missing",
]
